<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adataviz</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header>
      <span class="logo1" aria-hidden="true">📖</span>
      <h1 class="titre-principal">Livres les plus empruntés à Paris en 2022</h1>
      <span class="logo2" aria-hidden="true">📖</span>
    </header>
    <main>
      <section class="filtres">
        <button class="btn-affichage-filtres">Afficher les filtres</button>
        <div class="filtre-select cache">
          <label for="type-de-document">
            Type d'ouvrage
            <select
              name="type-de-document"
              id="type-de-document"
              data-cle="typeDoc"
            ></select>
          </label>

          <label for="auteur">
            Auteur
            <select name="auteur" id="auteur" data-cle="auteur"></select>
          </label>
          <label class="recherche" for="champ-recherche"
            >Rechercher :
            <input
              type="search"
              name="champ-recherche"
              id="champ-recherche"
              minlength="3"
              spellcheck="false"
          /></label>
          <div class="btn-ordre">
            <button
              class="tri-nb-de-prets-decroissant"
              aria-label="trier les livres par ordre décroissant de prêts"
            >
              ⬇️
            </button>
            <button
              class="tri-nb-de-prets-croissant"
              arai-label="trier les livres par ordre croissant de prêts"
            >
              ⬆️
            </button>
          </div>
        </div>
      </section>
      <section class="cartes"></section>
      <p class="nb-total-livres">Nombre total de livres : 100</p>
    </main>
  </body>
</html>
